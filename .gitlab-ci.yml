stages: [lint, formating, test, build, save, deploy]

default:
  tags: [k8s]

variables:
  CI_TOOLS_IMAGE: $CI_REGISTRY_IMAGE/build-deps/ci-tools@sha256:6549ad99bab16b81b16a96b22ef97959da5994a2b55ce20d08a4ba9ed9fdac97
  UV_CACHE_DIR: .cache/uv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  S3_ENDPOINT_URL: https://storage.yandexcloud.net
  AWS_DEFAULT_REGION: ru-central1

.python:
  image: $CI_TOOLS_IMAGE
  before_script:
    - uv sync --frozen
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]

lint:
  extends: .python
  stage: lint
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync black --check --workers 1 .
    - uv run --no-sync mypy

formating:
  extends: .python
  stage: formating
  script:
    - uv run --no-sync black --check --workers 1 .

test:
  extends: .python
  stage: test
  script:
    - uv run --no-sync pytest --junitxml=docs/evidence/junit.xml
  artifacts:
    when: always
    reports:
      junit: docs/evidence/junit.xml

build:
  stage: build
  image:
    name: moby/buildkit:v0.23.2-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    BUILD_FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/build-deps/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720
    BUILD_PYTHON_IMAGE: $CI_REGISTRY_IMAGE/build-deps/python@sha256:6e13e65c55e33adf203d77ee371cf8bf5d81bd4902ef07565721f46bf44917af
  before_script:
    - umask 077
    - mkdir -p ~/.docker
    - task_auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$task_auth" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt platform=linux/amd64 --opt "build-arg:BUILDKIT_SYNTAX=$BUILD_FRONTEND_IMAGE" --opt "build-arg:PYTHON_IMAGE=$BUILD_PYTHON_IMAGE" --output "type=image,name=$CI_REGISTRY_IMAGE:build-$CI_PIPELINE_ID,push=true" --metadata-file build-metadata.json
  artifacts:
    paths: [build-metadata.json]
    expire_in: 1 day

test_alerts:
  stage: test
  image:
    name: prom/prometheus:v3.5.0
    entrypoint: [""]
  script:
    - cmp mlops/deploy/alerts.yml mlops/grafana/chart/files/alerts.yml
    - cmp mlops/deploy/loki.yml mlops/grafana/chart/files/loki.yml
    - cmp mlops/grafana/dashboards/ecom.json mlops/grafana/chart/files/ecom.json
    - cd mlops/deploy && promtool test rules alerts-test.yml

save:
  stage: save
  image: $CI_TOOLS_IMAGE
  needs: [build]
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | skopeo login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - task_digest=$(jq -er '."containerimage.digest"' build-metadata.json)
    - skopeo copy --preserve-digests "docker://$CI_REGISTRY_IMAGE@$task_digest" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - printf '%s@%s\n' "$CI_REGISTRY_IMAGE" "$task_digest" > image-digest.txt
  artifacts:
    paths: [image-digest.txt]

deploy:
  stage: deploy
  image: $CI_TOOLS_IMAGE
  needs: [save]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - mkdir -p ~/.ssh
    - printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
  script:
    - test -n "$MODEL_VERSION" && test -n "$MODEL_MANIFEST_KEY"
    - export APP_IMAGE="$(cat image-digest.txt)"
    - sh scripts/ci_deploy.sh

deploy_k8s:
  extends: .python
  stage: deploy
  needs: [save]
  resource_group: ecom-kubernetes
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - umask 077
    - mkdir -p .secrets
    - printf '%s' "$KUBE_CONFIG_B64" | base64 -d > .secrets/kubeconfig
    - export KUBECONFIG="$PWD/.secrets/kubeconfig"
    - export APP_IMAGE="$(cat image-digest.txt)"
    - uv run --no-sync python -m scripts.deploy_k8s
  artifacts:
    when: always
    paths: [.artifacts/k8s-ci-smoke.json, .artifacts/k8s-port-forward.log]
